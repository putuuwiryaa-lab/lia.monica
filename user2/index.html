<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self' 'unsafe-inline';style-src 'self' 'unsafe-inline';connect-src 'self';img-src 'self' data:;frame-ancestors 'none';base-uri 'self';form-action 'self'"><title>Analisis Multi-Pasaran</title><style>:root{--bg:#0b1120;--surface:#111827;--line:#263247;--text:#f8fafc;--muted:#8b98ab;--accent:#38bdf8;--accent2:#0284c7;--success:#22c55e}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{background:var(--bg);color:var(--text);min-height:100vh;padding:18px 12px calc(92px + env(safe-area-inset-bottom));display:flex;justify-content:center}.container{width:100%;max-width:560px}.header{margin-bottom:18px}.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.header h2{font-size:1.25rem;font-weight:750}.subtitle{margin-top:4px;color:var(--muted);font-size:.78rem}.logout-btn{flex:none;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 11px;font-size:.72rem;font-weight:700;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.section-label{font-size:.73rem;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.count{font-size:.72rem;color:var(--muted)}.search{width:100%;height:44px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);outline:0;padding:0 13px;font-size:.88rem;margin-bottom:9px}.search:focus{border-color:var(--accent)}.search::placeholder{color:#64748b}.actions{display:flex;gap:7px;margin-bottom:10px}.small-btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 11px;font-size:.74rem;font-weight:600}.market-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:14px}.market-chip{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:7px;min-width:0;min-height:46px;padding:9px 10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--text);cursor:pointer}.market-chip input{display:none}.market-chip.active{background:rgba(2,132,199,.18);border-color:var(--accent2)}.market-name{min-width:0;font-size:.78rem;font-weight:650;line-height:1.15;overflow-wrap:anywhere}.market-last{font-size:.71rem;font-weight:700;color:var(--muted);white-space:nowrap}.market-chip.active .market-last{color:#bae6fd}.empty,.loading{grid-column:1/-1;text-align:center;padding:22px;color:var(--muted);font-size:.8rem}.process-wrap{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent);z-index:20}.process-inner{max-width:560px;margin:auto}.btn-calc{width:100%;height:48px;border:0;border-radius:10px;background:var(--accent);color:#062033;font-size:.9rem;font-weight:800}.market-result-card{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px}.market-title{color:var(--accent);font-weight:750;font-size:.82rem;margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid var(--line);text-transform:uppercase}pre{font-family:"Courier New",monospace;font-size:1.05rem;line-height:1.5;color:#4ade80;font-weight:700;letter-spacing:1px;white-space:pre-wrap}.button-group{display:flex;flex-direction:column;gap:7px;margin-top:12px}.btn-copy{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);padding:11px;border-radius:9px;font-size:.8rem;font-weight:650}.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--success);color:#03130a;padding:10px 18px;border-radius:20px;font-size:.78rem;font-weight:750;display:none;z-index:100}.error{color:#f87171;font-size:.78rem;text-align:center;margin-top:7px;line-height:1.4;display:none}@media(min-width:480px){.market-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><div class="container"><header class="header"><div class="header-row"><div><h2>Analisis Multi-Pasaran</h2><p class="subtitle">Pilih pasaran untuk diproses</p></div><button class="logout-btn" id="logout-button" type="button">LOG OUT</button></div></header><div class="toolbar"><span class="section-label">Pasaran</span><span class="count" id="market-count">0 dipilih</span></div><input id="market-search" class="search" type="search" autocomplete="off" placeholder="Cari pasaran..."><div class="actions"><button class="small-btn" id="select-all" type="button">Pilih Semua</button><button class="small-btn" id="clear-all" type="button">Bersihkan</button></div><div id="loading-markets" class="loading">Memuat data pasaran...</div><div class="market-grid" id="market-list" style="display:none"></div><div id="error-msg" class="error"></div><div id="output-container"></div></div><div class="process-wrap"><div class="process-inner"><button class="btn-calc" id="process-button" type="button">PROSES HASIL</button></div></div><div id="toast" class="toast">Berhasil disalin!</div><script src="/user2/app.js" defer></script><script>document.getElementById('logout-button').addEventListener('click',async()=>{try{await fetch('/api/logout',{method:'POST',credentials:'include'})}finally{location.replace('/login.html')}});</script></body></html>
