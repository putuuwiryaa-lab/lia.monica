<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';connect-src 'self';frame-ancestors 'none'"><title>User 2</title><style>:root{--bg:#0b1120;--surface:#111827;--line:#263247;--text:#f8fafc;--muted:#8b98ab;--accent:#38bdf8}*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:20px}.card{max-width:500px;width:100%;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:center}h1{font-size:1.2rem}.muted{color:var(--muted);font-size:.8rem}.logout{margin-top:16px;border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 16px;border-radius:8px}</style></head><body><main class="card"><h1>USER 2</h1><p class="muted">Halaman ini siap digunakan untuk rumus dan engine berbeda.</p><button class="logout" id="logout">KELUAR</button></main><script>document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',credentials:'include'});location.replace('/login.html')}</script></body></html>
