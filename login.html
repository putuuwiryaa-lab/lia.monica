<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';connect-src 'self';frame-ancestors 'none';base-uri 'self';form-action 'self'"><title>Login</title><style>:root{--bg:#0b1120;--surface:#111827;--line:#263247;--text:#f8fafc;--muted:#8b98ab;--accent:#38bdf8;--danger:#f87171}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{min-height:100vh;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:20px}.card{width:100%;max-width:390px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.3)}h1{font-size:1.2rem;margin-bottom:5px}.sub{font-size:.78rem;color:var(--muted);margin-bottom:18px}.users{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.user{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:13px 8px;text-align:center;cursor:pointer;font-weight:750}.user.active{border-color:var(--accent);background:rgba(56,189,248,.1)}label{display:block;font-size:.7rem;color:var(--muted);font-weight:700;margin-bottom:6px}input{width:100%;height:44px;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:0 12px;outline:0;font-size:.88rem}input:focus{border-color:var(--accent)}button.submit{width:100%;height:46px;margin-top:10px;border:0;border-radius:9px;background:var(--accent);color:#062033;font-weight:800;cursor:pointer}.error{display:none;color:var(--danger);font-size:.75rem;margin-top:10px;text-align:center}</style></head><body><main class="card"><h1>Login</h1><p class="sub">Pilih halaman</p><div class="users"><button class="user active" type="button" data-user="user1">USER 1</button><button class="user" type="button" data-user="user2">USER 2</button></div><form id="login-form"><input id="username" type="hidden" value="user1"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"><button class="submit" type="submit">MASUK</button><div id="error" class="error">Username atau password salah.</div></form></main><script src="/login.js" defer></script><script>document.querySelectorAll('.user').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.user').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('username').value=b.dataset.user}));</script></body></html>
