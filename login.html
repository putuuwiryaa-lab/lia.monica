<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';connect-src 'self';frame-ancestors 'none';base-uri 'self';form-action 'self'">
<title>Login</title>
<style>
:root{--bg:#0b1120;--surface:#111827;--line:#263247;--text:#f8fafc;--muted:#8b98ab;--accent:#38bdf8;--danger:#f87171}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}body{min-height:100vh;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:20px}.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.3)}h1{font-size:1.2rem;margin-bottom:5px}.sub{font-size:.78rem;color:var(--muted);margin-bottom:20px}.field{margin-bottom:11px}label{display:block;font-size:.73rem;color:var(--muted);font-weight:700;margin-bottom:6px}input{width:100%;height:44px;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:0 12px;outline:0;font-size:.88rem}input:focus{border-color:var(--accent)}button{width:100%;height:46px;margin-top:4px;border:0;border-radius:9px;background:var(--accent);color:#062033;font-weight:800;cursor:pointer}.error{display:none;color:var(--danger);font-size:.75rem;margin-top:10px;text-align:center}.note{margin-top:14px;color:var(--muted);font-size:.68rem;text-align:center;line-height:1.4}
</style></head>
<body><main class="card"><h1>Login</h1><p class="sub">Masuk untuk memilih halaman analisis</p><form id="login-form"><div class="field"><label for="username">USERNAME</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">PASSWORD</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button type="submit">MASUK</button><div id="error" class="error">Username atau password salah.</div></form><p class="note">Password tidak disimpan di halaman ini. Konfigurasi autentikasi akan dipasang melalui environment variable pada backend.</p></main><script src="/login.js" defer></script></body></html>
