<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Analisis Multi-Pasaran</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/config.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
            --chip-bg: #334155;
            --chip-active: #0284c7;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            min-height: 100vh;
            padding: 16px 12px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%; 
            max-width: 480px; 
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        h2 { 
            font-size: 1.25rem; 
            color: var(--accent); 
            font-weight: 700;
        }

        p.subtitle { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            margin-top: 4px;
        }

        .section-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .market-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); 
            gap: 8px; 
            margin-bottom: 16px; 
            max-height: 200px; 
            overflow-y: auto; 
            padding: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .market-chip { 
            display: flex; 
            align-items: center; 
            justify-content: center;
            font-size: 0.85rem; 
            font-weight: 600;
            background: var(--chip-bg); 
            color: var(--text-color);
            padding: 12px 8px; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            cursor: pointer; 
            user-select: none;
            transition: all 0.15s ease;
            text-align: center;
            min-height: 44px;
        }

        .market-chip input { display: none; }

        .market-chip.active {
            background-color: var(--chip-active);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .btn-calc { 
            background-color: var(--accent); 
            color: #0f172a; 
            border: none; 
            padding: 14px; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 1rem; 
            cursor: pointer; 
            width: 100%; 
            min-height: 48px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }

        .btn-calc:active { opacity: 0.85; transform: scale(0.98); }

        .market-result-card { 
            margin-top: 14px; 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            padding: 14px; 
        }

        .market-title { 
            color: var(--accent); 
            font-weight: 700; 
            font-size: 0.95rem; 
            margin-bottom: 6px; 
            border-bottom: 1px dashed var(--border-color); 
            padding-bottom: 6px; 
        }

        pre { 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 1.15rem; 
            line-height: 1.5; 
            color: #4ade80; 
            font-weight: 700; 
            letter-spacing: 1px;
        }

        .button-group { 
            display: flex; 
            flex-direction: column;
            gap: 8px; 
            margin-top: 16px; 
        }

        .btn-copy { 
            width: 100%;
            background-color: var(--card-bg); 
            color: var(--text-color); 
            border: 1px solid var(--border-color); 
            padding: 12px; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            font-weight: 600; 
            cursor: pointer; 
            min-height: 44px;
        }

        .btn-copy:active { background-color: var(--border-color); }

        .toast { 
            position: fixed; 
            bottom: calc(20px + env(safe-area-inset-bottom)); 
            left: 50%; 
            transform: translateX(-50%); 
            background-color: var(--success); 
            color: #000; 
            padding: 12px 24px; 
            border-radius: 24px; 
            font-size: 0.85rem; 
            font-weight: 700; 
            display: none; 
            z-index: 1000; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: max-content;
        }

        .error { color: #ef4444; font-size: 0.8rem; text-align: center; margin-top: 8px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Analisis Multi-Pasaran</h2>
        <p class="subtitle">Hitung & kalkulasi angka berdasarkan pasaran pilihan</p>
    </div>

    <span class="section-label">Pilih Pasaran</span>
    <div id="loading-markets" style="text-align:center; font-size:0.85rem; color: var(--text-muted); padding: 12px;">Memuat data pasaran...</div>
    <div class="market-grid" id="market-list" style="display: none;"></div>

    <button class="btn-calc" onclick="prosesPasaran()">Proses Hasil</button>
    <div id="error-msg" class="error"></div>

    <div id="output-container"></div>
</div>

<div id="toast" class="toast">Berhasil disalin!</div>

<script>
    const supabase = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
    );

    const ML = {0:1, 1:0, 2:5, 3:8, 4:7, 5:2, 6:9, 7:4, 8:3, 9:6};
    const MB = {0:8, 1:7, 2:6, 3:9, 4:5, 5:4, 6:2, 7:1, 8:0, 9:3};
    const TY = {0:7, 1:4, 2:9, 3:6, 4:1, 5:8, 6:3, 7:0, 8:5, 9:2};

    let allAiResults = [];
    let allNonAiResults = [];

    async function loadMarkets() {
        const loading = document.getElementById('loading-markets');
        const marketList = document.getElementById('market-list');

        try {
            if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
                throw new Error("Kredensial belum terkonfigurasi di server.");
            }

            const { data, error } = await supabase
                .from('markets')
                .select('id, name, order')
                .order('order', { ascending: true });

            if (error) throw error;

            if (!data || data.length === 0) {
                loading.textContent = "Data pasaran tidak tersedia.";
                return;
            }

            loading.style.display = 'none';
            marketList.style.display = 'grid';
            marketList.innerHTML = '';

            data.forEach(m => {
                const displayName = m.name || m.id;
                const label = document.createElement('label');
                label.className = 'market-chip';
                label.innerHTML = `<input type="checkbox" value="${m.id}" data-name="${displayName}" onchange="toggleChip(this)"> ${displayName}`;
                marketList.appendChild(label);
            });

        } catch (err) {
            console.error(err);
            loading.style.color = "#ef4444";
            loading.textContent = `Gagal memuat: ${err.message || "Periksa koneksi/database"}`;
        }
    }

    function toggleChip(cb) {
        if (cb.checked) {
            cb.parentElement.classList.add('active');
        } else {
            cb.parentElement.classList.remove('active');
        }
    }

    function sumReduce(n) {
        while (n >= 10) {
            n = String(n).split('').reduce((acc, curr) => acc + parseInt(curr), 0);
        }
        return n;
    }

    function generateData(keyDigit) {
        let aiList = [];
        for (let i = 0; i < 4; i++) aiList.push((keyDigit + i) % 10);
        let aiStr = aiList.join('');

        let sisaList = [];
        for (let d = 0; d < 10; d++) {
            if (!aiList.includes(d)) sisaList.push(d);
        }
        let sisaStr = sisaList.join('');

        return { ai: aiStr, nonAi: sisaStr, full: `${aiStr} ${sisaStr}` };
    }

    function parseHistoryResults(rawHistory, lastResult) {
        let list = [];
        if (rawHistory) {
            try {
                const parsed = JSON.parse(rawHistory);
                if (Array.isArray(parsed)) list = parsed.map(String);
            } catch {
                list = String(rawHistory).match(/\b\d{4}\b/g) || [];
            }
        }
        if (list.length === 0 && lastResult) {
            list = [String(lastResult)];
        }
        return list;
    }

    async function prosesPasaran() {
        const checkboxes = Array.from(document.querySelectorAll('#market-list input:checked'));
        const errorMsg = document.getElementById('error-msg');
        const container = document.getElementById('output-container');

        if (checkboxes.length === 0) {
            errorMsg.textContent = "Silakan pilih minimal satu pasaran.";
            errorMsg.style.display = 'block';
            return;
        }
        errorMsg.style.display = 'none';
        container.innerHTML = '<div style="text-align:center; padding:20px; font-size:0.85rem; color:var(--text-muted);">Sedang menghitung...</div>';

        const selectedIds = checkboxes.map(cb => cb.value);

        const { data, error } = await supabase
            .from('markets')
            .select('id, name, history_data, last_result')
            .in('id', selectedIds);

        if (error || !data) {
            container.innerHTML = `<div style="text-align:center; color:#ef4444; padding:15px; font-size:0.85rem;">Gagal mengambil data pasaran.</div>`;
            return;
        }

        allAiResults = [];
        allNonAiResults = [];
        let htmlBuffer = '';

        for (const cb of checkboxes) {
            const marketId = cb.value;
            const marketName = cb.getAttribute('data-name');
            const marketData = data.find(m => m.id === marketId);

            if (!marketData) continue;

            const results = parseHistoryResults(marketData.history_data, marketData.last_result);

            if (results.length < 3) {
                htmlBuffer += `
                    <div class="market-result-card">
                        <div class="market-title">${marketName}</div>
                        <div style="color:#ef4444; font-size:0.8rem;">Riwayat keluaran belum cukup (min 3 result).</div>
                    </div>`;
                continue;
            }

            const [A1, K1, C1, E1] = results[0].split('').map(Number);
            const [A2, K2, C2, E2] = results[1].split('').map(Number);
            const [A3, K3, C3, E3] = results[2].split('').map(Number);

            const r1 = generateData(ML[sumReduce(K1 + C1 + E1)]);
            const r2 = generateData(TY[sumReduce(ML[sumReduce(A1 + K1 + C1 + E1)] + MB[sumReduce(K1 + C1 + E1)] + ((C2 + 5) % 10))]);
            const r3 = generateData((sumReduce(ML[A3] + MB[C3] + K3) + 8) % 10);
            const r4 = generateData(((((sumReduce(C1 + E1) - ((C1 + 9) % 10)) % 10 + 10) % 10) + 5) % 10);

            allAiResults.push(`[ ${marketName} ]\n${r1.ai}\n${r2.ai}\n${r3.ai}\n${r4.ai}`);
            allNonAiResults.push(`[ ${marketName} ]\n${r1.nonAi}\n${r2.nonAi}\n${r3.nonAi}\n${r4.nonAi}`);

            htmlBuffer += `
                <div class="market-result-card">
                    <div class="market-title">${marketName}</div>
                    <pre>${r1.full}\n${r2.full}\n${r3.full}\n${r4.full}</pre>
                </div>`;
        }

        if (allAiResults.length > 0) {
            htmlBuffer += `
                <div class="button-group">
                    <button class="btn-copy" onclick="copyAllAI()">📋 Salin Angka Utama</button>
                    <button class="btn-copy" onclick="copyAllNonAI()">📋 Salin Angka Sisa</button>
                </div>`;
        }

        container.innerHTML = htmlBuffer;
    }

    function copyText(text, msg) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => showToast(msg));
        } else {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast(msg);
            } catch (e) {
                window.prompt("Salin manual:", text);
            } finally {
                document.body.removeChild(textArea);
            }
        }
    }

    function showToast(msg) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.style.display = "block";
        setTimeout(() => toast.style.display = "none", 2000);
    }

    function copyAllAI() { copyText(allAiResults.join('\n\n'), '✓ Angka Utama Disalin!'); }
    function copyAllNonAI() { copyText(allNonAiResults.join('\n\n'), '✓ Angka Sisa Disalin!'); }

    loadMarkets();
</script>
</body>
</html>
