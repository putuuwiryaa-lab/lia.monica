<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
<title>Analisis Multi-Pasaran</title>
<style>
:root{--bg-color:#0f172a;--card-bg:#1e293b;--accent:#38bdf8;--text-color:#f8fafc;--text-muted:#94a3b8;--border-color:#334155;--success:#22c55e;--chip-bg:#334155;--chip-active:#0284c7}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg-color);color:var(--text-color);min-height:100vh;padding:16px 12px;padding-bottom:calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:center}.container{width:100%;max-width:480px;margin:0 auto}.header{text-align:center;margin-bottom:16px}h2{font-size:1.25rem;color:var(--accent);font-weight:700}p.subtitle{font-size:.8rem;color:var(--text-muted);margin-top:4px}.section-label{font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:.5px}.market-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px;padding:4px;width:100%}.market-chip{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto;align-items:center;column-gap:7px;font-size:.82rem;font-weight:600;background:var(--chip-bg);color:var(--text-color);padding:10px 9px;border-radius:8px;border:1px solid var(--border-color);cursor:pointer;user-select:none;transition:all .15s ease;text-align:left;min-height:44px;overflow:hidden;line-height:1.2}.market-chip input{display:none}.market-chip.active{background:var(--chip-active);border-color:var(--accent);color:#fff;box-shadow:0 0 10px rgba(56,189,248,.3)}.market-name{min-width:0;overflow-wrap:anywhere;word-break:break-word}.market-last{font-size:.72rem;font-weight:600;color:var(--text-muted);white-space:nowrap;text-align:right;letter-spacing:.3px}.market-chip.active .market-last{color:rgba(255,255,255,.85)}.btn-calc{background:var(--accent);color:#0f172a;border:none;padding:14px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;width:100%;min-height:48px;box-shadow:0 4px 12px rgba(56,189,248,.25)}.btn-calc:active{opacity:.85;transform:scale(.98)}.market-result-card{margin-top:14px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:10px;padding:14px}.market-title{color:var(--accent);font-weight:700;font-size:.95rem;margin-bottom:6px;border-bottom:1px dashed var(--border-color);padding-bottom:6px;text-transform:uppercase}pre{font-family:'Courier New',Courier,monospace;font-size:1.15rem;line-height:1.5;color:#4ade80;font-weight:700;letter-spacing:1px;white-space:pre-wrap}.button-group{display:flex;flex-direction:column;gap:8px;margin-top:16px}.btn-copy{width:100%;background:var(--card-bg);color:var(--text-color);border:1px solid var(--border-color);padding:12px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;min-height:44px}.btn-copy:active{background:var(--border-color)}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--success);color:#000;padding:12px 24px;border-radius:24px;font-size:.85rem;font-weight:700;display:none;z-index:1000;box-shadow:0 4px 15px rgba(0,0,0,.5);width:max-content}.error{color:#ef4444;font-size:.8rem;text-align:center;margin-top:8px;display:none;line-height:1.4}@media (min-width:420px){.market-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.market-chip{font-size:.84rem}}
</style>
</head>
<body>
<div class="container"><div class="header"><h2>Analisis Multi-Pasaran</h2><p class="subtitle">Hitung & kalkulasi angka berdasarkan pasaran pilihan</p></div><span class="section-label">Pilih Pasaran</span><div id="loading-markets" style="text-align:center;font-size:.85rem;color:var(--text-muted);padding:12px">Memuat data pasaran...</div><div class="market-grid" id="market-list" style="display:none"></div><button class="btn-calc" id="process-button">Proses Hasil</button><div id="error-msg" class="error"></div><div id="output-container"></div></div><div id="toast" class="toast">Berhasil disalin!</div>
<script src="/app.js" defer></script>
</body></html>
