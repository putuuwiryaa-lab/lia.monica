<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"><title>Analisis Multi-Pasaran</title>
<style>
:root{--bg:#0b1120;--surface:#111827;--surface2:#172033;--line:#263247;--text:#f8fafc;--muted:#8b98ab;--accent:#38bdf8;--accent2:#0284c7;--success:#22c55e;--danger:#f87171}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{background:var(--bg);color:var(--text);min-height:100vh;padding:18px 12px calc(92px + env(safe-area-inset-bottom));display:flex;justify-content:center}.container{width:100%;max-width:560px}.header{margin-bottom:18px}.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.header h2{font-size:1.25rem;font-weight:750;letter-spacing:-.3px}.subtitle{margin-top:4px;color:var(--muted);font-size:.78rem}.logout-btn{flex:none;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 11px;font-size:.72rem;font-weight:700;cursor:pointer}.logout-btn:active{opacity:.7}.tool-card{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 13px;margin-bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);cursor:pointer;text-align:left}.tool-left{display:flex;flex-direction:column;gap:3px}.tool-label{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.tool-name{font-size:.85rem;font-weight:700}.tool-arrow{font-size:1.1rem;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.section-label{font-size:.73rem;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.count{font-size:.72rem;color:var(--muted)}.search{width:100%;height:44px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--text);outline:0;padding:0 13px;font-size:.88rem;margin-bottom:9px}.search:focus{border-color:var(--accent)}.search::placeholder{color:#64748b}.actions{display:flex;gap:7px;margin-bottom:10px}.small-btn{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 11px;font-size:.74rem;font-weight:600;cursor:pointer}.market-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:14px}.market-chip{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:7px;min-width:0;min-height:46px;padding:9px 10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--text);cursor:pointer;user-select:none;text-align:left}.market-chip input{display:none}.market-chip.active{background:rgba(2,132,199,.18);border-color:var(--accent2)}.market-name{min-width:0;font-size:.78rem;font-weight:650;line-height:1.15;overflow-wrap:anywhere}.market-last{font-size:.71rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.market-chip.active .market-last{color:#bae6fd}.empty,.loading{grid-column:1/-1;text-align:center;padding:22px;color:var(--muted);font-size:.8rem}.process-wrap{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent);z-index:20}.process-inner{max-width:560px;margin:auto}.btn-calc{width:100%;height:48px;border:0;border-radius:10px;background:var(--accent);color:#062033;font-size:.9rem;font-weight:800;cursor:pointer}.market-result-card{margin-top:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0}.market-title{color:var(--accent);font-weight:750;font-size:.75rem;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}pre{font-family:"Courier New",monospace;font-size:.94rem;line-height:1.45;color:#4ade80;font-weight:700;letter-spacing:.7px;white-space:pre-wrap}.button-group{display:flex;flex-direction:column;gap:7px;margin-top:12px}.btn-copy{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);padding:11px;border-radius:9px;font-size:.8rem;font-weight:650}.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--success);color:#03130a;padding:10px 18px;border-radius:20px;font-size:.78rem;font-weight:750;display:none;z-index:100}.error{color:var(--danger);font-size:.78rem;text-align:center;margin-top:7px;line-height:1.4;display:none}.modal{position:fixed;inset:0;background:rgba(2,6,23,.78);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:80}.modal.open{display:flex}.modal-box{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.45)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.modal-title{font-size:.95rem;font-weight:750}.close{border:0;background:transparent;color:var(--muted);font-size:1.3rem;padding:3px;cursor:pointer}.split-input{width:100%;min-height:110px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:11px;font:600 .82rem/1.45 "Courier New",monospace;outline:0}.split-input:focus{border-color:var(--accent)}.split-run{width:100%;height:44px;margin-top:9px;border:0;border-radius:9px;background:var(--accent);color:#062033;font-weight:800}.split-error{display:none;color:var(--danger);font-size:.74rem;margin-top:7px}.split-output{display:none;margin-top:13px}.split-block{margin-top:9px}.split-label{display:block;color:var(--muted);font-size:.7rem;font-weight:700;text-transform:uppercase;margin-bottom:5px}.split-row{display:flex;gap:7px}.split-row input{min-width:0;flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;font:600 .78rem "Courier New",monospace}.split-copy{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;padding:0 12px;font-size:.74rem;font-weight:700}#output-container{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start}#output-container .button-group{grid-column:1/-1}#output-container>.loading,#output-container>.empty{grid-column:1/-1}@media(max-width:340px){#output-container{grid-template-columns:1fr}}@media(min-width:480px){.market-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.modal{align-items:center}.modal-box{max-width:480px}}
</style></head>
<body><div class="container"><header class="header"><div class="header-row"><div><h2>Analisis Multi-Pasaran</h2><p class="subtitle">Pilih pasaran untuk diproses</p></div><button class="logout-btn" id="logout-button" type="button">LOG OUT</button></div></header><button class="tool-card" id="open-tool" type="button"><span class="tool-left"><span class="tool-label">Tools</span><span class="tool-name">Pemisah Line 3D</span></span><span class="tool-arrow">›</span></button><div class="toolbar"><span class="section-label">Pasaran</span><span class="count" id="market-count">0 dipilih</span></div><input id="market-search" class="search" type="search" autocomplete="off" placeholder="Cari pasaran..."><div class="actions"><button class="small-btn" id="select-all" type="button">Pilih Semua</button><button class="small-btn" id="clear-all" type="button">Bersihkan</button></div><div id="loading-markets" class="loading">Memuat data pasaran...</div><div class="market-grid" id="market-list" style="display:none"></div><div id="error-msg" class="error"></div><div id="output-container"></div></div><div class="process-wrap"><div class="process-inner"><button class="btn-calc" id="process-button" type="button">PROSES HASIL</button></div></div><div id="toast" class="toast">Berhasil disalin!</div><div class="modal" id="splitter-modal"><div class="modal-box"><div class="modal-head"><div class="modal-title">Pemisah Line 3D</div><button class="close" id="close-tool" type="button">×</button></div><textarea id="splitter-input" class="split-input" placeholder="001*002*003*004*005*006*007*008*009*000"></textarea><button class="split-run" id="splitter-run" type="button">PEMISAH</button><div id="splitter-error" class="split-error"></div><div id="splitter-output" class="split-output"><div class="split-block"><span class="split-label">Bagian 1</span><div class="split-row"><input id="splitter-a" readonly><button class="split-copy" id="copy-splitter-a" type="button">COPY</button></div></div><div class="split-block"><span class="split-label">Bagian 2</span><div class="split-row"><input id="splitter-b" readonly><button class="split-copy" id="copy-splitter-b" type="button">COPY</button></div></div></div></div></div><script src="/app.js" defer></script><script>document.getElementById('logout-button').addEventListener('click',async()=>{try{await fetch('/api/logout',{method:'POST',credentials:'include'})}finally{location.replace('/login.html')}});</script></body></html>
