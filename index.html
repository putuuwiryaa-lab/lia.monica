<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Analisis Multi-Pasaran</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<style>
:root{--bg-color:#0f172a;--card-bg:#1e293b;--accent:#38bdf8;--text-color:#f8fafc;--text-muted:#94a3b8;--border-color:#334155;--success:#22c55e;--chip-bg:#334155;--chip-active:#0284c7}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg-color);color:var(--text-color);min-height:100vh;padding:16px 12px;padding-bottom:calc(20px + env(safe-area-inset-bottom));display:flex;justify-content:center}.container{width:100%;max-width:480px;margin:0 auto}.header{text-align:center;margin-bottom:16px}h2{font-size:1.25rem;color:var(--accent);font-weight:700}p.subtitle{font-size:.8rem;color:var(--text-muted);margin-top:4px}.section-label{font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:8px;display:block;text-transform:uppercase;letter-spacing:.5px}.market-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px;padding:4px;width:100%}.market-chip{display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:600;background:var(--chip-bg);color:var(--text-color);padding:11px 7px;border-radius:8px;border:1px solid var(--border-color);cursor:pointer;user-select:none;transition:all .15s ease;text-align:center;min-height:44px;overflow-wrap:anywhere;word-break:break-word;line-height:1.2}.market-chip input{display:none}.market-chip.active{background:var(--chip-active);border-color:var(--accent);color:#fff;box-shadow:0 0 10px rgba(56,189,248,.3)}.btn-calc{background:var(--accent);color:#0f172a;border:none;padding:14px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;width:100%;min-height:48px;box-shadow:0 4px 12px rgba(56,189,248,.25)}.btn-calc:active{opacity:.85;transform:scale(.98)}.market-result-card{margin-top:14px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:10px;padding:14px}.market-title{color:var(--accent);font-weight:700;font-size:.95rem;margin-bottom:6px;border-bottom:1px dashed var(--border-color);padding-bottom:6px;text-transform:uppercase}pre{font-family:'Courier New',Courier,monospace;font-size:1.15rem;line-height:1.5;color:#4ade80;font-weight:700;letter-spacing:1px;white-space:pre-wrap}.button-group{display:flex;flex-direction:column;gap:8px;margin-top:16px}.btn-copy{width:100%;background:var(--card-bg);color:var(--text-color);border:1px solid var(--border-color);padding:12px;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;min-height:44px}.btn-copy:active{background:var(--border-color)}.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--success);color:#000;padding:12px 24px;border-radius:24px;font-size:.85rem;font-weight:700;display:none;z-index:1000;box-shadow:0 4px 15px rgba(0,0,0,.5);width:max-content}.error{color:#ef4444;font-size:.8rem;text-align:center;margin-top:8px;display:none;line-height:1.4}@media (min-width:420px){.market-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.market-chip{font-size:.84rem}}
</style>
</head>
<body>
<div class="container"><div class="header"><h2>Analisis Multi-Pasaran</h2><p class="subtitle">Hitung & kalkulasi angka berdasarkan pasaran pilihan</p></div><span class="section-label">Pilih Pasaran</span><div id="loading-markets" style="text-align:center;font-size:.85rem;color:var(--text-muted);padding:12px">Memuat data pasaran...</div><div class="market-grid" id="market-list" style="display:none"></div><button class="btn-calc" onclick="prosesPasaran()">Proses Hasil</button><div id="error-msg" class="error"></div><div id="output-container"></div></div><div id="toast" class="toast">Berhasil disalin!</div>
<script>
const ML={0:1,1:0,2:5,3:8,4:7,5:2,6:9,7:4,8:3,9:6},MB={0:8,1:7,2:6,3:9,4:5,5:4,6:2,7:1,8:0,9:3},TY={0:7,1:4,2:9,3:6,4:1,5:8,6:3,7:0,8:5,9:2};
let supabaseClient=null,allAiResults=[],allNonAiResults=[];
function setLoading(message,isError=false){const el=document.getElementById('loading-markets');el.textContent=message;el.style.color=isError?'#ef4444':'var(--text-muted)'}
async function initSupabase(){try{if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Library Supabase gagal dimuat.');let url=window.SUPABASE_URL,key=window.SUPABASE_ANON_KEY;if(!url||!key){const r=await fetch('/config.js',{cache:'no-store'});if(!r.ok)throw new Error(`Config server tidak tersedia (HTTP ${r.status}).`);const t=await r.text(),u=t.match(/window\.SUPABASE_URL\s*=\s*(["'])(.*?)\1/),k=t.match(/window\.SUPABASE_ANON_KEY\s*=\s*(["'])(.*?)\1/);url=u?.[2];key=k?.[2]}if(!url||!key)throw new Error('SUPABASE_URL atau SUPABASE_ANON_KEY kosong.');supabaseClient=window.supabase.createClient(url,key);return true}catch(err){console.error('Supabase init:',err);setLoading(`Gagal konfigurasi: ${err.message}`,true);return false}}
async function loadMarkets(){if(!supabaseClient&&!(await initSupabase()))return;const loading=document.getElementById('loading-markets'),list=document.getElementById('market-list');setLoading('Memuat data pasaran...');try{const {data,error}=await supabaseClient.from('markets').select('id,name,order');if(error)throw error;if(!Array.isArray(data)||data.length===0){setLoading('Data pasaran tidak tersedia.',true);return}data.sort((a,b)=>{const ao=Number(a.order),bo=Number(b.order);if(Number.isFinite(ao)&&Number.isFinite(bo))return ao-bo;if(Number.isFinite(ao))return -1;if(Number.isFinite(bo))return 1;return String(a.name||a.id).localeCompare(String(b.name||b.id),'id',{numeric:true,sensitivity:'base'})});loading.style.display='none';list.style.display='grid';list.innerHTML='';data.forEach(m=>{const name=String(m.name||m.id).toUpperCase(),label=document.createElement('label');label.className='market-chip';const input=document.createElement('input');input.type='checkbox';input.value=m.id;input.dataset.name=name;input.addEventListener('change',()=>toggleChip(input));label.append(input,document.createTextNode(name));list.appendChild(label)})}catch(err){console.error('Load markets:',err);setLoading(`Gagal memuat pasaran: ${err.message||'Periksa koneksi Supabase.'}`,true)}}
function toggleChip(cb){cb.parentElement.classList.toggle('active',cb.checked)}function sumReduce(n){while(n>=10)n=String(n).split('').reduce((a,c)=>a+Number(c),0);return n}function generateData(k){const a=[];for(let i=0;i<4;i++)a.push((k+i)%10);const ai=a.join(''),s=[];for(let d=0;d<10;d++)if(!a.includes(d))s.push(d);return{ai,nonAi:s.join(''),full:`${ai} ${s.join('')}`}}function parseHistoryResults(raw,last){let l=[];if(raw){try{const p=typeof raw==='string'?JSON.parse(raw):raw;if(Array.isArray(p))l=p.map(String)}catch{l=String(raw).match(/\b\d{4}\b/g)||[]}}if(!l.length&&last)l=[String(last)];return l}
async function prosesPasaran(){const boxes=Array.from(document.querySelectorAll('#market-list input:checked')),em=document.getElementById('error-msg'),out=document.getElementById('output-container');if(!boxes.length){em.textContent='Silakan pilih minimal satu pasaran.';em.style.display='block';return}em.style.display='none';out.innerHTML='<div style="text-align:center;padding:20px;font-size:.85rem;color:var(--text-muted)">Sedang menghitung...</div>';try{const ids=boxes.map(x=>x.value),{data,error}=await supabaseClient.from('markets').select('id,name,history_data,last_result').in('id',ids);if(error)throw error;allAiResults=[];allNonAiResults=[];let html='';for(const cb of boxes){const id=cb.value,name=cb.dataset.name,m=data?.find(x=>String(x.id)===String(id));if(!m)continue;const r=parseHistoryResults(m.history_data,m.last_result);if(r.length<3){html+=`<div class="market-result-card"><div class="market-title">${name}</div><div style="color:#ef4444;font-size:.8rem">Riwayat keluaran belum cukup (min 3 result).</div></div>`;continue}const [A1,K1,C1,E1]=r[0].padStart(4,'0').split('').map(Number),[A2,K2,C2,E2]=r[1].padStart(4,'0').split('').map(Number),[A3,K3,C3,E3]=r[2].padStart(4,'0').split('').map(Number);const r1=generateData(ML[sumReduce(K1+C1+E1)]),r2=generateData(TY[sumReduce(ML[sumReduce(A1+K1+C1+E1)]+MB[sumReduce(K1+C1+E1)]+((C2+5)%10))]),r3=generateData((sumReduce(ML[A3]+MB[C3]+K3)+8)%10),r4=generateData(((((sumReduce(C1+E1)-((C1+9)%10))%10+10)%10)+5)%10);allAiResults.push(`[ ${name} ]\n${r1.ai}\n${r2.ai}\n${r3.ai}\n${r4.ai}`);allNonAiResults.push(`[ ${name} ]\n${r1.nonAi}\n${r2.nonAi}\n${r3.nonAi}\n${r4.nonAi}`);html+=`<div class="market-result-card"><div class="market-title">${name}</div><pre>${r1.full}\n${r2.full}\n${r3.full}\n${r4.full}</pre></div>`}if(allAiResults.length)html+=`<div class="button-group"><button class="btn-copy" onclick="copyAllAI()">📋 Salin Angka Utama</button><button class="btn-copy" onclick="copyAllNonAI()">📋 Salin Angka Sisa</button></div>`;out.innerHTML=html}catch(err){console.error('Process:',err);out.innerHTML=`<div style="text-align:center;color:#ef4444;padding:15px;font-size:.85rem">Gagal mengambil data: ${err.message||'unknown error'}</div>`}}
function copyText(t,msg){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>showToast(msg)).catch(()=>fallbackCopy(t,msg));else fallbackCopy(t,msg)}function fallbackCopy(t,msg){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');showToast(msg)}catch{window.prompt('Salin manual:',t)}finally{ta.remove()}}function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000)}function copyAllAI(){copyText(allAiResults.join('\n\n'),'✓ Angka Utama Disalin!')}function copyAllNonAI(){copyText(allNonAiResults.join('\n\n'),'✓ Angka Sisa Disalin!')}
loadMarkets();
</script></body></html>
